name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job uses `DeterminateSystems/nix-installer-action@v22` to install
# Nix and `DeterminateSystems/magic-nix-cache-action@v14` to share the
# GitHub-hosted cache of /nix/store across jobs and across pushes.
# `nix develop --command` is used in every job so the CI exercises the
# same dev environment contributors use.

jobs:
  nix-eval:
    name: nix-eval (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Evaluate flake outputs
        id: eval
        run: |
          nix develop --command nix flake check --no-build --print-build-logs \
            2>&1 | tee eval.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## nix flake check (eval only)"
            echo
            if [ "${{ steps.eval.outcome }}" = "success" ]; then
              echo "✅ All flake outputs evaluated cleanly."
              echo
              echo "Outputs evaluated:"
              grep -oE "checking (derivation|flake output) [^.]+\.[A-Za-z0-9_.-]+" eval.log \
                | sort -u | sed 's/^/- /'
            else
              echo "❌ Evaluation failed."
              echo
              echo '```'
              tail -40 eval.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  test:
    name: ert tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run ert tests
        id: ert
        run: |
          nix develop --command emacs --batch \
            -l test/run-tests.el -f ert-run-tests-batch-and-exit \
            2>&1 | tee test.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## ert tests"
            echo
            if grep -qE "^Ran [0-9]+ tests, [0-9]+ results as expected, 0 unexpected" test.log; then
              line=$(grep -oE "Ran [0-9]+ tests, [0-9]+ results as expected, 0 unexpected" test.log | tail -1)
              echo "✅ $line"
            else
              echo "❌ Test failures or run error."
              echo
              echo '```'
              grep -E "^(   FAILED|Test [a-z/-]+ condition:|Ran )" test.log | tail -30
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Run integration tests (Mockoon)
        id: integration
        run: |
          nix develop --command emacs --batch \
            -l test/integration/run-integration-tests.el \
            -f ert-run-tests-batch-and-exit \
            2>&1 | tee integration.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## Integration tests (Mockoon mock server)"
            echo
            if grep -qE "^Ran [0-9]+ tests, [0-9]+ results as expected, 0 unexpected" integration.log; then
              line=$(grep -oE "Ran [0-9]+ tests, [0-9]+ results as expected, 0 unexpected" integration.log | tail -1)
              echo "✅ $line"
            else
              echo "❌ Integration test failures or run error."
              echo
              echo '```'
              grep -E "^(   FAILED|Test [a-z/-]+ condition:|Ran |Error:)" integration.log | tail -30
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  lint:
    name: lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Byte-compile + checkdoc lint
        id: lint
        run: |
          nix develop --command emacs --batch -L . \
            -l hooks/lint.el -f org-mode-google-tasks-sync-lint \
            2>&1 | tee lint.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## lint"
            echo
            if [ "${{ steps.lint.outcome }}" = "success" ]; then
              echo "✅ Byte-compile + checkdoc clean."
            else
              echo "❌ Lint failed."
              echo
              echo '```'
              tail -40 lint.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  nix-lint:
    name: nix-lint (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: statix + deadnix
        id: nix-lint
        run: |
          nix develop --command sh -c '
            set -o pipefail
            statix check . 2>&1 | tee statix.log
            deadnix --no-lambda-pattern-names . 2>&1 | tee deadnix.log
          ' 2>&1 | tee nix-lint.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## nix-lint (statix + deadnix)"
            echo
            if [ "${{ steps.nix-lint.outcome }}" = "success" ]; then
              echo "✅ statix + deadnix clean."
            else
              echo "❌ nix-lint found issues."
              echo
              echo '```'
              tail -40 nix-lint.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: nix build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          # FlakeHub disabled: no registry lookups, no FlakeHub
          # binary cache — everything resolves via github: inputs
          # and cache.nixos.org (plus Magic Nix Cache below).
          flakehub: false
      - name: Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - name: Build the package
        id: build
        run: |
          nix develop --command nix build .#default \
            --print-build-logs --no-link --print-out-paths \
            2>&1 | tee build.log
      - name: Job summary
        if: always()
        run: |
          {
            echo "## nix build .#default"
            echo
            if [ "${{ steps.build.outcome }}" = "success" ]; then
              path=$(grep -oE '/nix/store/[a-z0-9]{32}-emacs-org-mode-google-tasks-sync-[^[:space:]]+' build.log | tail -1)
              version=$(echo "$path" | grep -oE 'emacs-org-mode-google-tasks-sync-[0-9][^/]*$')
              echo "✅ Package built: \`$version\`"
              echo
              echo "Store path: \`$path\`"
            else
              echo "❌ Build failed."
              echo
              echo '```'
              tail -40 build.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [nix-eval, test, integration, lint, nix-lint, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete existing release (if any)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
